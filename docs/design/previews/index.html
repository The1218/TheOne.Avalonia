<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheOne · 控件库设计提案</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#21352c;background:#f4f6f3;line-height:1.6}
*{box-sizing:border-box}body{margin:0}header{padding:32px 5vw;border-bottom:1px solid #d9e3dc;display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap}
h1{font-size:28px;letter-spacing:-1px;margin:4px 0}p{margin:6px 0;color:#52655b}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#13745c}
.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}label{font-size:13px;font-weight:600}select,button{font:inherit;background:#fff;color:inherit;border:1px solid #6e897a;border-radius:6px;padding:7px 12px;margin-left:6px}
main{padding:28px 5vw}.intro{margin-bottom:24px;max-width:900px}.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
article{background:#fff;border:1px solid #d9e3dc;border-radius:12px;overflow:hidden}.meta{padding:20px 22px}.name{display:flex;gap:12px;align-items:center}h2{font-size:20px;margin:0}.badge{background:#e6f3ec;color:#13745c;font-size:12px;padding:2px 8px;border-radius:4px}.description{font-size:13px;margin-top:8px;min-height:42px}
a.image{display:block;background:#edf2ee;line-height:0}img{width:100%;height:auto;display:block}.foot{font-size:12px;padding:14px 22px;color:#52655b;border-top:1px solid #d9e3dc}
footer{padding:24px 5vw;border-top:1px solid #d9e3dc;color:#52655b;font-size:12px}dialog{border:1px solid #6e897a;padding:10px;border-radius:10px;width:min(1320px,96vw);max-height:96vh}dialog::backdrop{background:#10231dcc}dialog form{text-align:right;margin-bottom:8px}dialog img{width:100%}select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #13745c;outline-offset:3px}
@media(max-width:600px){header{padding:24px}main{padding:20px}.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body>
<header><div><div class="eyebrow">THEONE / DESIGN EXPLORATION 01</div><h1>为跨平台桌面应用，建立自己的视觉语言。</h1><p>三个方向 · 浅色 / 深色 · 真实 Avalonia + Skia 渲染</p></div>
<div class="controls"><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>窗口<select id="viewport"><option value="wide">宽屏 · 1280 × 800</option><option value="compact">紧凑 · 800 × 600</option></select></label></div></header>
<main><p class="intro">推荐 B · Still：以青绿建立识别，以暖白和石墨承载内容。三套提案展示相同控件，便于比较布局、密度、圆角与状态。点击图片可放大；紧凑图展示可滚动页面的首屏。</p><div class="grid" id="grid"></div></main>
<footer>静态设计评审 · 扩展控件为视觉样例，完整交互将在选定方向后实现。技术说明见 ../README.md。</footer>
<dialog id="zoom"><form method="dialog"><button>关闭</button></form><img id="zoom-image" alt="放大的控件库设计图"></dialog>
<script>
const variants=[{id:'A',name:'Clarity',description:'蓝色、原生秩序、较小圆角。适合表单密集的企业桌面应用。'},
{id:'B',name:'Still',description:'青绿、暖白与石墨、轻量面板。适合具有独立品牌的跨平台控件库。'},
{id:'C',name:'Signal',description:'琥珀、编辑式布局、清晰边界。适合创作与开发工具。'}];
const theme=document.getElementById('theme'),viewport=document.getElementById('viewport'),grid=document.getElementById('grid'),zoom=document.getElementById('zoom');
function render(){grid.replaceChildren();for(const v of variants){const article=document.createElement('article');
article.innerHTML=`<div class="meta"><div class="name"><h2>${v.id} / ${v.name}</h2>${v.id==='B'?'<span class="badge">推荐</span>':''}</div><p class="description">${v.description}</p></div><a class="image" href="${v.id}/${viewport.value}-${theme.value}.png"><img src="${v.id}/${viewport.value}-${theme.value}.png" alt="${v.id} ${v.name} ${theme.value==='light'?'浅色':'深色'}设计图"></a><div class="foot">${viewport.value==='wide'?'双列布局 · 完整控件概览':'单列布局 · 侧栏折叠'} / 点击放大</div>`;
article.querySelector('a').addEventListener('click',e=>{e.preventDefault();document.getElementById('zoom-image').src=e.currentTarget.href;zoom.showModal()});grid.appendChild(article)}}
theme.addEventListener('change',render);viewport.addEventListener('change',render);render();
</script></body></html>
